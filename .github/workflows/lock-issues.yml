name: 'Lock Threads'

on:
  schedule:
    - cron: '0 * * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  action:
    # Running the lock job on all forks is unnecessary.
    # Make sure this only runs in the main repo.
    if: github.repository == 'psf/requests'

    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v2
        with:
            issue-lock-inactive-days: 90
            pr-lock-inactive-days: 90
